name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC federation with the pippamanicom-github-deploy IAM role (see infra/)
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: af-south-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The build's prerender step (scripts/prerender.mjs) renders the SPA
      # to static HTML for crawlers. It needs a headless browser.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed assets are immutable — cache them for a year. HTML and
      # crawler files must always revalidate so deploys go live instantly.
      - name: Sync immutable assets to S3
        run: |
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "robots.txt" \
            --exclude "sitemap.xml"

      - name: Upload HTML and crawler files
        run: |
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "robots.txt" \
            --include "sitemap.xml"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
